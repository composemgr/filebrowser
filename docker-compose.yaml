# nginx proxy address - http://172.17.0.1:64170

name: filebrowser
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: filebrowser-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
    ports:
      - '172.17.0.1:64170:80'
    volumes:
      - './volumes/config/filebrowser:/config'
      - './volumes/data/filebrowser:/srv'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - filebrowser

networks:
  filebrowser:
    name: filebrowser
    external: false
